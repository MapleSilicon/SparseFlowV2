name: SparseFlow CI

on:
  push:
    branches: [main, feat/resnet18-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q sparseflow run_bench.py
      - name: Test
        run: python -m pytest -q
      - name: Gate 2 smoke benchmark
        run: python run_bench.py --preset resnet18-gate2 --output report-resnet18-gate2-ci.json
      - name: Release readiness
        run: python scripts/check_release.py --allow-dirty
      - name: Dependency consistency
        run: python -m pip check
